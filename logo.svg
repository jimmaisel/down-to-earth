    <path d="M150,452 Q250,430 360,448 T500,452 T650,440 L650,650 L150,650 Z" fill="url(#dirt)"/>
    <path d="M150,500 Q300,480 420,500 T650,490" fill="none" stroke="#a9744a" stroke-width="3" opacity=".5"/>

