    <g>
      <path d="M408,428 L424,406 L482,406 L496,428 Z" fill="#6d7a81"/>
      <path d="M408,428 L496,428 L496,432 L408,432 Z" fill="#555f64"/>
      <rect x="414" y="432" width="76" height="40" fill="#5c5448"/>
      <rect x="440" y="442" width="18" height="30" fill="#3e382f"/>
      <rect x="468" y="440" width="14" height="12" fill="#7c93a3"/>
      <path d="M421,432 V472 M432,432 V472 M466,432 V472 M476,432 V472 M487,432 V472" stroke="#463f35" stroke-width="1.2"/>
