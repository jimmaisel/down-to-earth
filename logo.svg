    <g>
      <path d="M284,328 L288,268 L294,258 L302,262 L306,276 L310,328 Z" fill="#a39a88"/>
      <path d="M306,276 L310,328 L298,328 L300,270 Z" fill="#7d7566"/>
      <path d="M312,328 L314,238 L320,228 L329,222 L338,228 L343,244 L346,328 Z" fill="#b0a791"/>
      <path d="M333,226 L343,244 L346,328 L330,328 L334,250 Z" fill="#82796a"/>
      <path d="M318,262 L336,258 M316,290 L344,285 M315,312 L345,308" stroke="#6a6256" stroke-width="1.6" fill="none"/>
      <path d="M350,328 L353,272 L360,262 L368,266 L372,282 L374,328 Z" fill="#a39a88"/>
