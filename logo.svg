  <circle cx="400" cy="400" r="246" fill="none" stroke="#1b1e25" stroke-width="10"/>
  <circle cx="400" cy="400" r="251" fill="none" stroke="#9aa0a8" stroke-width="5"/>

  <!-- ring text -->
  <text font-size="80" fill="#e6d5a8" letter-spacing="3" text-anchor="middle" stroke="#7b4325" stroke-width="1.2" paint-order="stroke">
    <textPath href="#topArc" startOffset="50%">DOWN TO EARTH</textPath>
  </text>
  <text font-size="26" fill="#d9783f" letter-spacing="2.5" text-anchor="middle">
    <textPath href="#botArc1" startOffset="50%">SERVING HOLLIDAYSBURG, PA • EST. 2025</textPath>
  </text>
  <text font-size="42" fill="#e6d5a8" letter-spacing="3" text-anchor="middle">
    <textPath href="#botArc2" startOffset="50%">LICENSED &amp; INSURED</textPath>
  </text>
  <circle cx="89" cy="400" r="8" fill="#c96a3a"/>
  <circle cx="711" cy="400" r="8" fill="#c96a3a"/>

  <!-- banner -->
  <path d="M40,572 L88,560 L88,630 L40,642 L62,607 Z" fill="#364352" stroke="#14161b" stroke-width="3" stroke-linejoin="round"/>
  <path d="M760,572 L712,560 L712,630 L760,642 L738,607 Z" fill="#364352" stroke="#14161b" stroke-width="3" stroke-linejoin="round"/>
  <rect x="78" y="546" width="644" height="72" fill="#4d5d6c" stroke="#14161b" stroke-width="4"/>
  <rect x="86" y="554" width="628" height="56" fill="none" stroke="#9fb0bf" stroke-width="1.5" opacity=".6"/>
  <text x="400" y="596" font-size="42" fill="#e6d5a8" text-anchor="middle" textLength="590" lengthAdjust="spacingAndGlyphs">EXCAVATING • DEMOLITION • HAULING</text>
</svg>
