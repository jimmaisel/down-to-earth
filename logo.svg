<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" font-family="Impact, 'Arial Narrow Bold', 'Franklin Gothic Medium', sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34506f"/>
      <stop offset=".55" stop-color="#7c9bb0"/>
      <stop offset="1" stop-color="#f0bd78"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#fff2b8" stop-opacity=".9"/>
      <stop offset="1" stop-color="#fff2b8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8d5d33"/>
      <stop offset="1" stop-color="#5e3b22"/>
    </linearGradient>
    <clipPath id="scene"><circle cx="400" cy="400" r="246"/></clipPath>
    <clipPath id="miniScene"><circle r="12"/></clipPath>
    <path id="topArc" d="M 121,400 A 279,279 0 0 1 679,400"/>
    <path id="botArc1" d="M 54,400 A 346,346 0 0 0 746,400"/>
    <path id="botArc2" d="M 88,400 A 312,312 0 0 0 712,400"/>
    <path id="pine" d="M0,-30 L-9,-8 L-5,-8 L-12,6 L-6,6 L-14,22 L14,22 L6,6 L12,6 L5,-8 L9,-8 Z"/>
    <!-- small copy of the logo, used on the truck door -->
    <g id="mini">
      <circle r="20" fill="#c96a3a"/>
      <circle r="18" fill="#1b1e25"/>
      <g clip-path="url(#miniScene)">
        <rect x="-12" y="-12" width="24" height="24" fill="#8fb0c4"/>
        <circle cx="4" cy="-3" r="3" fill="#f5c451"/>
        <path d="M-12,2 L-12,-2 L-6,-4 L-4,-8 L-3,-4 L-1,-9 L0,-4 L1,-7 L2,-3 L6,-3 L12,-1 L12,12 L-12,12 Z" fill="#5b6f6f"/>
        <rect x="-12" y="4" width="24" height="8" fill="#7a4f2c"/>
      </g>
      <circle r="12" fill="none" stroke="#9aa0a8" stroke-width=".8"/>
      <rect x="-14" y="2" width="28" height="5" fill="#4d5d6c"/>
      <path d="M-15.3,-3 A15.5,15.5 0 0 1 15.3,-3" fill="none" stroke="#e6d5a8" stroke-width="2.2" stroke-dasharray="2.2 1.4"/>
      <path d="M-13,9 A15.5,15.5 0 0 0 13,9" fill="none" stroke="#e6d5a8" stroke-width="2" stroke-dasharray="2 1.4"/>
    </g>
  </defs>

  <!-- rings -->
  <circle cx="400" cy="400" r="394" fill="#c96a3a"/>
  <circle cx="400" cy="400" r="388" fill="#1b1e25"/>
  <circle cx="400" cy="400" r="376" fill="none" stroke="#9aa0a8" stroke-width="3"/>

  <!-- scene -->
