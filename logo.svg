      <path d="M298,420 L340,508 L330,508 L292,424 Z" fill="#3d4350"/>
      <rect x="215" y="505" width="135" height="9" fill="#1c1e24"/>
      <path d="M350,509 L378,511" stroke="#1c1e24" stroke-width="5"/>
      <circle cx="262" cy="528" r="19" fill="#101216"/><circle cx="262" cy="528" r="15" fill="#1d1e22"/><circle cx="262" cy="528" r="7" fill="#aab0b8"/>
      <circle cx="302" cy="528" r="19" fill="#101216"/><circle cx="302" cy="528" r="15" fill="#1d1e22"/><circle cx="302" cy="528" r="7" fill="#aab0b8"/>
    </g>

    <!-- truck -->
    <g>
      <rect x="372" y="494" width="218" height="36" rx="4" fill="#223b5e"/>
      <rect x="372" y="480" width="86" height="18" rx="2" fill="#1d3354"/>
      <path d="M455,497 L463,462 L515,455 L540,478 L545,497 Z" fill="#223b5e"/>
      <path d="M470,490 L474,468 L510,463 L527,481 L530,490 Z" fill="#7f9fc2"/>
      <path d="M540,478 L578,488 L590,500 L590,530 L540,530 Z" fill="#223b5e"/>
      <rect x="578" y="496" width="14" height="28" fill="#b9bec6"/>
