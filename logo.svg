    <circle cx="470" cy="350" r="80" fill="url(#glow)"/>
    <circle cx="470" cy="350" r="30" fill="#f7cf63"/>
    <ellipse cx="260" cy="240" rx="55" ry="7" fill="#fff" opacity=".22"/>
    <ellipse cx="560" cy="270" rx="45" ry="6" fill="#fff" opacity=".2"/>
    <ellipse cx="380" cy="200" rx="40" ry="5" fill="#fff" opacity=".18"/>

    <!-- far ridge -->
    <path d="M150,380 L150,340 L200,328 L245,334 L285,322 L370,322 L410,338 L450,326 L500,334 L545,320 L600,336 L650,330 L650,480 L150,480 Z" fill="#4f6b73"/>
    <path d="M150,400 Q300,385 400,398 T650,392 L650,480 L150,480 Z" fill="#3f5a5c"/>

