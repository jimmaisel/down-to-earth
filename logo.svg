      <use href="#mini" x="499" y="510" transform="translate(499 510) scale(0.8) translate(-499 -510)"/>
      <circle cx="405" cy="528" r="26" fill="#0e1014"/><circle cx="405" cy="528" r="21" fill="#1c1d21"/><circle cx="405" cy="528" r="11" fill="#b9bfc7"/><circle cx="405" cy="528" r="4" fill="#5d636b"/>
      <circle cx="550" cy="528" r="26" fill="#0e1014"/><circle cx="550" cy="528" r="21" fill="#1c1d21"/><circle cx="550" cy="528" r="11" fill="#b9bfc7"/><circle cx="550" cy="528" r="4" fill="#5d636b"/>
