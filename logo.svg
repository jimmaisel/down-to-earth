        <path d="M222,455 H347 M222,480 H347" stroke="#3d4350" stroke-width="3"/>
        <path d="M242,455 V505 M262,455 V505 M282,455 V505 M302,455 V505 M322,455 V505 M342,455 V505" stroke="#3d4350" stroke-width="3"/>
        <rect x="222" y="455" width="125" height="50" fill="none" stroke="#14161b" stroke-width="3"/>
