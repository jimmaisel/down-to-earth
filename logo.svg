      <rect x="578" y="490" width="10" height="5" fill="#f3d98b"/>
      <rect x="574" y="524" width="20" height="6" fill="#aeb4bc"/>
      <path d="M372,494 H455 M463,462 L515,455 L540,478 L578,488" fill="none" stroke="#4c6f9d" stroke-width="2"/>
