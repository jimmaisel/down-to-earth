      <rect x="566" y="428" width="48" height="30" rx="4" fill="#4a86b5"/>
      <rect x="570" y="432" width="20" height="16" fill="#cfe3f1"/>
      <rect x="566" y="450" width="48" height="8" fill="#2f5f86"/>
